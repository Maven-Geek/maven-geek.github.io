<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Timothy Olaniran, Data Scientist</title>
  <meta name="description"
    content="Timothy Olaniran is a data scientist in Nigeria who builds machine learning models and data-driven applications with Python, SQL and modern ML frameworks.">
  <meta property="og:title" content="Timothy Olaniran, Data Scientist">
  <meta property="og:description" content="Machine learning projects, data science applications and articles.">
  <meta property="og:type" content="website">
  <link rel="icon" href="images/favicon.svg" type="image/svg+xml">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">

  <!-- Apply the saved theme before the page paints, so there is no flash -->
  <script>
    try {
      var saved = localStorage.getItem("theme");
      if (saved === "light" || saved === "dark") document.documentElement.setAttribute("data-theme", saved);
    } catch (e) { }
  </script>
</head>

<body>
  <a class="skip" href="#main">Skip to content</a>

  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="#top" data-fill="name">Timothy Olaniran</a>
      <nav class="topnav" aria-label="Sections">
        <a href="#projects">Projects</a>
        <a href="#experience">Experience</a>
        <a href="#contact">Contact</a>
      </nav>
      <button class="theme-toggle" type="button" aria-label="Switch colour theme">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
          <path d="M12 3a9 9 0 1 0 9 9 7 7 0 0 1-9-9z" fill="currentColor" />
        </svg>
      </button>
    </div>
  </header>

  <main id="main">
    <!-- Intro with photo -->
    <section class="hero" id="top" aria-labelledby="hero-name">
      <div class="hero-text">
        <h1 id="hero-name" data-fill="name">Timothy Olaniran</h1>
        <p class="hero-role" data-fill="roleline">Data Scientist in Osogbo, Nigeria</p>
        <div class="hero-intro" data-fill="intro"></div>
        <div class="hero-actions" data-fill="actions"></div>
        <!-- Repetitive facts section hidden for now
        <dl class="facts" data-fill="facts"></dl>
        -->
      </div>
      <figure class="portrait">
        <div class="adire" aria-hidden="true"></div>
        <img data-fill="photo" alt="" width="800" height="1000">
        <div class="initials" aria-hidden="true" data-fill="initials"></div>
      </figure>
    </section>

    <div class="layout">
      <!-- Lineage rail: section navigation on wide screens -->
      <aside class="rail" aria-label="On this page">
        <ol class="rail-list"></ol>
      </aside>

      <div class="content">
        <section class="block" id="skills" data-node="Skills" aria-labelledby="h-skills">
          <h2 id="h-skills">Skills</h2>
          <dl class="skills" data-fill="skills"></dl>
        </section>

        <section class="block" id="projects" data-node="Projects" aria-labelledby="h-projects">
          <h2 id="h-projects">Projects</h2>
          <div class="projects" data-fill="projects"></div>
        </section>

        <section class="block" id="experience" data-node="Experience" aria-labelledby="h-experience">
          <h2 id="h-experience">Experience</h2>
          <div data-fill="experience"></div>
        </section>

        <!-- Article section hidden for now
        <section class="block" id="articles" data-node="Articles" aria-labelledby="h-articles">
          <h2 id="h-articles">Articles</h2>
          <ol class="articles" data-fill="articles"></ol>
        </section>
        -->

        <section class="block" id="education" data-node="Education" aria-labelledby="h-education">
          <h2 id="h-education">Education and certifications</h2>
          <div class="edu-grid">
            <div>
              <h3 class="minor">Education</h3>
              <ul class="plain" data-fill="education"></ul>
            </div>
            <div>
              <h3 class="minor">Certifications</h3>
              <ul class="plain" data-fill="certifications"></ul>
            </div>
          </div>
        </section>

        <section class="block contact" id="contact" data-node="Contact" aria-labelledby="h-contact">
          <h2 id="h-contact">Contact</h2>
          <p class="contact-line" data-fill="contactLine"></p>
          <div class="contact-links" data-fill="contactLinks"></div>
        </section>
      </div>
    </div>
  </main>

  <footer class="footer">
    <p data-fill="footer"></p>
  </footer>

  <noscript>
    <p class="noscript">This site needs JavaScript turned on to show its content.</p>
  </noscript>

  <script src="js/data.js"></script>
  <script src="js/main.js"></script>
</body>

</html>
